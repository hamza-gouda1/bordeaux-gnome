# Single source of truth for the Bordeaux design tokens ("Hallmark" direction,
# see docs/design-spec.md). tools/build.py renders templates/*.tmpl with these
# values into themes/<Variant>/. Do not hand-edit the generated CSS.
#
# Template syntax:  ${token}        the value as written
#                   ${token@30}     a hex/rgba colour token at 30% alpha
# Variant tables override shared tables of the same key.

[shared.font]
font-sans = '"Geist", sans-serif'
font-mono = '"Geist Mono", monospace'
fw-regular = "400"
fw-medium = "500"
fw-semibold = "600"

[shared.type]               # type scale
fs-eyebrow = "10.5px"
fs-caption = "11px"
fs-body = "13px"
fs-body-lg = "14px"
fs-panel = "16px"           # top bar buttons, status text, indicator labels
fs-clock = "17px"           # top bar clock (proportional Geist, tabular figures)
fs-title = "15px"
fs-heading = "20px"
fs-display = "30px"
ls-eyebrow = "1.5px"        # .14em of 10.5px; St has no em tracking guarantee
ls-display = "-0.75px"      # -.025em of 30px

[shared.radius]
r-xs = "4px"                # chips
r-sm = "8px"                # buttons, entries
r-md = "12px"               # cards, lists
r-lg = "16px"               # tiles, cells
r-xl = "22px"
r-window = "14px"
r-island = "20px"          # half of island-h: a pill
r-pill = "9999px"
r-cut = "6px"               # the cut corner
r-dock = "30px"            # the dock slab: near-pill
r-slab = "6px 22px 22px 22px"   # cut top-left, then clockwise
r-folder = "26px"           # app-grid folder tile: all four corners round
r-folder-dialog = "28px"    # opened folder

[shared.space]              # 4-pt scale
sp-1 = "4px"
sp-2 = "8px"
sp-3 = "12px"
sp-4 = "16px"
sp-5 = "24px"
sp-6 = "32px"
sp-7 = "48px"
row-min = "56px"
row-sidebar = "38px"
header-h = "46px"
island-h = "40px"
island-mt = "8px"
panel-h = "56px"            # island-h + 2 * island-mt
icon-panel = "22px"           # status and indicator icons in the top bar

[shared.elevation]          # single layer only: St draws one box-shadow
e1-geom = "0 1px 2px"
e2-geom = "0 6px 16px"
e3-geom = "0 12px 28px"
e4-geom = "0 18px 40px"
blur-island = "22"          # blur-my-shell hints, px
blur-slab = "28"

[shared.motion]
dur-fast = "150ms"
dur-std = "200ms"
dur-enter = "300ms"
dur-exit = "150ms"
ease-std = "cubic-bezier(.2, 0, 0, 1)"
ease-enter = "cubic-bezier(.05, .7, .1, 1)"
ease-exit = "cubic-bezier(.3, 0, .8, .15)"

# ---------------------------------------------------------------------------
# Variants. Opaque colours are #rrggbb; translucent ones are rgba().
# ---------------------------------------------------------------------------

