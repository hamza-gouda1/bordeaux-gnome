name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools and GNOME settings schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nodejs gjs libglib2.0-bin \
            gsettings-desktop-schemas gnome-shell-extensions gnome-shell-extension-ubuntu-dock gnome-settings-daemon-common gnome-terminal dconf-gsettings-backend
      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh install-boot.sh tests/*.sh
      - name: Generated themes are up to date
        run: python3 tools/build.py --check
      - name: WCAG contrast
        run: python3 tools/check_contrast.py
      - name: Install, switch and uninstall in a throwaway home
        run: |
          bash tests/test_install.sh
          bash tests/test_boot.sh
      - name: Theme and follow-data regression tests
        run: |
          python3 tests/test_shell_css.py
          python3 tests/test_follow_json.py
          python3 tests/test_release_archive.py
      - name: Extension syntax and logic
        run: |
          for f in extensions/*/*.js tests/*.js; do node --input-type=module --check < "$f"; done
          if command -v gjs >/dev/null 2>&1; then
            for f in tests/*.js; do gjs -m "$f"; done
          else
            echo "::warning::GJS unavailable on runner; extension logic must pass locally before release"
          fi
      - name: Validate extension schemas
        run: |
          for d in extensions/*/schemas; do glib-compile-schemas --strict --dry-run "$d"; done
